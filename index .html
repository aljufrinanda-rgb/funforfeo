<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ FUNFORFEO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a0a; color:#f0f0f0;
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:24px 16px;
}
h1 {
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(52px,12vw,90px);
  letter-spacing:6px;
  background:linear-gradient(135deg,#00ff87,#3bf5ff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; line-height:1;
  margin-bottom:4px;
}
.sub { color:#555; font-size:13px; letter-spacing:3px; text-transform:uppercase; margin-bottom:32px; }

.box {
  background:#141414; border:1px solid #222;
  border-radius:20px; padding:28px 24px;
  width:100%; max-width:460px;
  margin-bottom:16px;
}

/* COUNTER */
.counter {
  display:flex; justify-content:center; gap:24px;
  margin-bottom:28px;
}
.counter-item { text-align:center; }
.counter-num {
  font-family:'Bebas Neue',sans-serif;
  font-size:48px; line-height:1;
  color:#00ff87;
}
.counter-label { font-size:12px; color:#555; letter-spacing:2px; text-transform:uppercase; margin-top:2px; }

/* FORM */
input, select {
  width:100%; background:#0a0a0a;
  border:1px solid #222; border-radius:12px;
  padding:14px 16px; color:#f0f0f0;
  font-family:'DM Sans',sans-serif; font-size:16px;
  outline:none; margin-bottom:12px;
  transition:border-color .2s;
}
input:focus, select:focus { border-color:#00ff87; }
select option { background:#111; }

.btn {
  width:100%; padding:15px;
  border:none; border-radius:12px;
  font-family:'DM Sans',sans-serif;
  font-weight:700; font-size:16px;
  letter-spacing:1px; text-transform:uppercase;
  cursor:pointer; transition:all .15s;
}
.btn:active { transform:scale(.98); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn-green { background:#00ff87; color:#000; }
.btn-green:hover:not(:disabled) { background:#00e07a; }
.btn-red { background:#ff3b3b; color:#fff; }
.btn-yellow { background:#ffe600; color:#000; }
.btn-ghost { background:transparent; border:1px solid #333; color:#666; margin-top:8px; }

.msg { font-size:14px; text-align:center; padding:10px; border-radius:8px; margin-top:8px; }
.msg-ok  { background:rgba(0,255,135,.1); color:#00ff87; }
.msg-err { background:rgba(255,59,59,.1); color:#ff3b3b; }

/* PLAYER LIST */
.player-list { display:flex; flex-direction:column; gap:8px; max-height:360px; overflow-y:auto; margin-top:16px; }
.player-list::-webkit-scrollbar { width:3px; }
.player-list::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }

.prow {
  display:flex; align-items:center; gap:10px;
  background:#0a0a0a; border:1px solid #1e1e1e;
  border-radius:10px; padding:10px 14px;
  animation:fadeIn .3s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.pnum { font-size:12px; color:#444; width:20px; text-align:right; flex-shrink:0; }
.pname { flex:1; font-weight:600; font-size:14px; }
.pbadge {
  font-size:11px; font-weight:700; letter-spacing:1px;
  padding:3px 8px; border-radius:5px;
}
.b-GK   { background:rgba(255,215,0,.15); color:#ffd700; }
.b-Beck { background:rgba(59,245,255,.15); color:#3bf5ff; }
.b-MF   { background:rgba(0,255,135,.15); color:#00ff87; }
.b-WF   { background:rgba(255,149,0,.15); color:#ff9500; }
.b-CF   { background:rgba(255,59,59,.15); color:#ff3b3b; }
.bdel { background:none; border:none; color:#333; font-size:18px; cursor:pointer; transition:color .2s; padding:0 2px; }
.bdel:hover { color:#ff3b3b; }

/* TEAMS */
.teams { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
@media(max-width:400px){ .teams { grid-template-columns:1fr; } }

.team {
  border-radius:14px; overflow:hidden;
  border:1px solid #222;
  animation:slideUp .4s ease forwards; opacity:0;
}
@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.team:nth-child(1){animation-delay:0s}
.team:nth-child(2){animation-delay:.08s}
.team:nth-child(3){animation-delay:.16s}
.team:nth-child(4){animation-delay:.24s}

.team-hd {
  padding:12px 16px;
  display:flex; justify-content:space-between; align-items:center;
}
.team-hd-name { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; }
.t1 .team-hd { background:rgba(255,59,59,.1); border-bottom:2px solid #ff3b3b; }
.t1 .team-hd-name { color:#ff3b3b; }
.t2 .team-hd { background:rgba(59,245,255,.1); border-bottom:2px solid #3bf5ff; }
.t2 .team-hd-name { color:#3bf5ff; }
.t3 .team-hd { background:rgba(0,255,135,.1); border-bottom:2px solid #00ff87; }
.t3 .team-hd-name { color:#00ff87; }
.t4 .team-hd { background:rgba(255,230,0,.1); border-bottom:2px solid #ffe600; }
.t4 .team-hd-name { color:#ffe600; }

.team-body { padding:10px; background:#111; }
.trow {
  display:flex; align-items:center; gap:8px;
  padding:6px 8px; border-radius:6px;
}
.trow.cap { background:rgba(255,230,0,.07); border:1px solid rgba(255,230,0,.15); margin-bottom:2px; }
.trow.gk  { background:rgba(255,215,0,.05); }
.tnum { font-size:11px; color:#444; width:16px; }
.tname { flex:1; font-size:13px; font-weight:600; }
.tpos {
  font-size:10px; font-weight:700; letter-spacing:1px;
  padding:2px 6px; border-radius:4px;
}

/* SHARE */
.share-txt {
  background:#0a0a0a; border:1px solid #222;
  border-radius:10px; padding:14px;
  font-size:12px; color:#666;
  white-space:pre-wrap; max-height:220px;
  overflow-y:auto; margin-top:12px;
  font-family:monospace; line-height:1.6;
}

/* OVERLAY */
.overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.95); z-index:999;
  flex-direction:column; justify-content:center;
  align-items:center; gap:16px;
}
.overlay.show { display:flex; }
.spin { font-size:72px; animation:spin .35s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.spin-txt {
  font-family:'Bebas Neue',sans-serif;
  font-size:32px; letter-spacing:4px; color:#00ff87;
  animation:pulse .5s ease-in-out infinite alternate;
}
@keyframes pulse { from{opacity:.4} to{opacity:1} }

/* LIVE dot */
.live { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#555; margin-bottom:20px; }
.live-dot { width:8px; height:8px; border-radius:50%; background:#ff3b3b; animation:blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

/* SECTION TOGGLE */
.page { display:none; width:100%; max-width:460px; }
.page.show { display:block; }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="spin">⚽</div>
  <div class="spin-txt">MENGUNDI...</div>
</div>

<h1>FUNFORFEO</h1>
<div class="sub">Mini Soccer · 4 Team Draw</div>
<div class="live"><div class="live-dot"></div> LIVE — <span id="liveCount">0</span> player terdaftar</div>

<!-- PAGE: DAFTAR -->
<div class="page show" id="pageDaftar">
  <div class="box">
    <div class="counter">
      <div class="counter-item">
        <div class="counter-num" id="cTotal">0</div>
        <div class="counter-label">Player</div>
      </div>
      <div class="counter-item">
        <div class="counter-num" id="cGK">0</div>
        <div class="counter-label">GK</div>
      </div>
      <div class="counter-item">
        <div class="counter-num" style="color:#3bf5ff;">4</div>
        <div class="counter-label">Team</div>
      </div>
    </div>

    <div id="formArea">
      <input type="text" id="inName" placeholder="Nama kamu..." maxlength="30" />
      <select id="inPos">
        <option value="">Pilih posisi kamu</option>
        <option value="GK">🧤 GK — Kiper</option>
        <option value="Beck">🛡️ Beck — Defender</option>
        <option value="MF">⚙️ MF — Midfielder</option>
        <option value="WF">⚡ WF — Winger</option>
        <option value="CF">🎯 CF — Striker</option>
      </select>
      <button class="btn btn-green" id="btnDaftar" onclick="daftar()">DAFTAR SEKARANG</button>
      <div id="formMsg"></div>
    </div>

    <div id="doneArea" style="display:none;text-align:center;padding:16px 0;">
      <div style="font-size:48px;margin-bottom:12px;">✅</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:#00ff87;">TERDAFTAR!</div>
      <div id="doneMsg" style="color:#555;font-size:14px;margin-top:8px;"></div>
    </div>
  </div>

  <!-- WHO'S IN -->
  <div class="box">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:#555;margin-bottom:4px;">YANG SUDAH DAFTAR</div>
    <div class="player-list" id="playerListPublic"></div>
  </div>

  <button class="btn btn-ghost" onclick="showAdmin()">🔒 Admin</button>
</div>

<!-- PAGE: ADMIN -->
<div class="page" id="pageAdmin">
  <!-- Password gate -->
  <div id="passGate" class="box">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#ffe600;margin-bottom:16px;text-align:center;">🔒 ADMIN</div>
    <input type="password" id="passInput" placeholder="Password admin..." maxlength="20"
      style="letter-spacing:4px;" onkeydown="if(event.key==='Enter')checkPass()" />
    <button class="btn btn-yellow" onclick="checkPass()">MASUK</button>
    <div id="passErr" style="color:#ff3b3b;font-size:13px;text-align:center;margin-top:10px;"></div>
    <button class="btn btn-ghost" onclick="showDaftar()">← Kembali</button>
  </div>

  <!-- Admin panel -->
  <div id="adminPanel" style="display:none;">
    <div class="box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:#ffe600;">👑 ADMIN PANEL</div>
        <div style="font-size:13px;color:#555;"><span id="adminCount">0</span>/44 player</div>
      </div>

      <button class="btn btn-green" id="btnUndi" onclick="undi()" style="font-size:18px;padding:18px;letter-spacing:2px;">🎲 MULAI UNDI</button>
      <div id="undiNotice" style="font-size:13px;color:#555;text-align:center;margin-top:10px;"></div>

      <div style="margin-top:20px;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:#333;margin-bottom:10px;">PLAYER LIST</div>
        <div class="player-list" id="playerListAdmin"></div>
      </div>

      <button class="btn btn-ghost" onclick="clearAll()" style="margin-top:16px;color:#ff3b3b;border-color:#ff3b3b33;">🗑 Reset Semua Player</button>
      <button class="btn btn-ghost" onclick="showDaftar()">← Kembali</button>
    </div>

    <!-- HASIL -->
    <div id="hasilArea"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://nvdvfogrodczxyivofqf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52ZHZmb2dyb2Rjenh5aXZvZnFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NzU0NDgsImV4cCI6MjA5NTI1MTQ0OH0.2Y-z5NUdeacAeqEcolgRlnCpUZn7ua-2xFdqRRELWS0';
const ADMIN_PASS  = '001400';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const TEAMS = [
  { name:'MERAH',  badge:'🔴', cls:'t1', color:'#ff3b3b' },
  { name:'BIRU',   badge:'🔵', cls:'t2', color:'#3bf5ff' },
  { name:'HIJAU',  badge:'🟢', cls:'t3', color:'#00ff87' },
  { name:'KUNING', badge:'🟡', cls:'t4', color:'#ffe600' },
];

let players = [];

// ── LOAD + REALTIME ───────────────────────────────────────
async function load() {
  const { data } = await db.from('Player').select('*').order('registered_at', { ascending: true });
  players = data || [];
  render();
}

db.channel('live').on('postgres_changes', { event:'*', schema:'public', table:'players' }, load).subscribe();
load();

// ── RENDER ────────────────────────────────────────────────
function render() {
  const total = players.length;
  const gks   = players.filter(p => p.Posisi === 'GK').length;

  // Pills
  document.getElementById('liveCount').textContent = total;
  document.getElementById('cTotal').textContent = total;
  document.getElementById('cGK').textContent = gks;
  document.getElementById('adminCount').textContent = total;

  // Public list
  renderList('playerListPublic', false);
  // Admin list
  renderList('playerListAdmin', true);

  // Undi notice
  const el = document.getElementById('undiNotice');
  if (el) {
    if (gks < 4)       el.textContent = `⚠️ Butuh 4 GK dulu (sekarang ${gks})`;
    else if (total < 8) el.textContent = `⚠️ Butuh minimal 8 player`;
    else                el.textContent = `✅ Siap! ${total} player, ${gks} GK`;
  }
  const btn = document.getElementById('btnUndi');
  if (btn) btn.disabled = (gks < 4 || total < 8);
}

function renderList(id, canDel) {
  const el = document.getElementById(id);
  if (!el) return;
  if (!players.length) {
    el.innerHTML = `<div style="text-align:center;padding:24px;color:#444;font-size:14px;">⏳ Belum ada yang daftar...</div>`;
    return;
  }
  el.innerHTML = players.map((p, i) => `
    <div class="prow">
      <div class="pnum">${i+1}</div>
      <div class="pname">${p.Nama}</div>
      <div class="pbadge b-${p.Posisi}">${p.Posisi}</div>
      ${canDel ? `<button class="bdel" onclick="del(${p.id})">×</button>` : ''}
    </div>
  `).join('');
}

// ── DAFTAR ────────────────────────────────────────────────
async function daftar() {
  const name = document.getElementById('inName').value.trim();
  const pos  = document.getElementById('inPos').value;
  const msg  = document.getElementById('formMsg');

  if (!name) { showMsg(msg, '⚠️ Nama belum diisi!', 'err'); return; }
  if (!pos)  { showMsg(msg, '⚠️ Pilih posisi dulu!', 'err'); return; }

  const gks = players.filter(p => p.Posisi === 'GK').length;
  if (pos === 'GK' && gks >= 4) { showMsg(msg, '⚠️ Slot GK sudah penuh (4/4)!', 'err'); return; }
  if (players.length >= 44)     { showMsg(msg, '⚠️ Player sudah penuh (44/44)!', 'err'); return; }

  const dup = players.find(p => p.Nama.toLowerCase() === name.toLowerCase());
  if (dup) { showMsg(msg, '⚠️ Nama ini sudah terdaftar!', 'err'); return; }

  document.getElementById('btnDaftar').disabled = true;
  showMsg(msg, 'Mendaftarkan...', '');

  const { error } = await db.from('Player').insert({ Nama: name, Posisi: pos });
  if (error) {
    showMsg(msg, '❌ Gagal: ' + error.message, 'err');
    document.getElementById('btnDaftar').disabled = false;
    return;
  }

  document.getElementById('formArea').style.display = 'none';
  document.getElementById('doneArea').style.display = 'block';
  document.getElementById('doneMsg').textContent = `${name} (${pos}) berhasil masuk daftar. Tunggu admin mulai undian!`;
}

function showMsg(el, txt, type) {
  el.textContent = txt;
  el.className = 'msg' + (type ? ' msg-'+type : '');
}

// ── DELETE ────────────────────────────────────────────────
async function del(id) { await db.from('Player').delete().eq('id', id); }

async function clearAll() {
  if (!confirm('Reset semua player? Tidak bisa di-undo!')) return;
  await db.from('Player').delete().neq('id', 0);
  document.getElementById('hasilArea').innerHTML = '';
}

// ── ADMIN NAV ─────────────────────────────────────────────
function showAdmin() {
  document.getElementById('pageDaftar').classList.remove('show');
  document.getElementById('pageAdmin').classList.add('show');
}
function showDaftar() {
  document.getElementById('pageAdmin').classList.remove('show');
  document.getElementById('pageDaftar').classList.add('show');
}
function checkPass() {
  const v = document.getElementById('passInput').value;
  if (v === ADMIN_PASS) {
    document.getElementById('passGate').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    render();
  } else {
    document.getElementById('passErr').textContent = '❌ Password salah!';
    document.getElementById('passInput').value = '';
  }
}

// ── UNDI ──────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function undi() {
  const gks   = players.filter(p => p.Posisi === 'GK');
  const nonGK = players.filter(p => p.Posisi !== 'GK');
  if (gks.length < 4 || nonGK.length < 4) return;

  document.getElementById('overlay').classList.add('show');

  setTimeout(() => {
    const sGK  = shuffle(gks);
    const sNon = shuffle(nonGK);
    const caps = sNon.slice(0,4);
    const rest = shuffle(sNon.slice(4));

    const teams = TEAMS.map((t,i) => ({
      ...t,
      players: [
        { ...sGK[i],  isGK:true,  isCap:false },
        { ...caps[i], isGK:false, isCap:true  },
      ]
    }));
    rest.forEach((p,i) => teams[i%4].players.push({...p,isGK:false,isCap:false}));

    document.getElementById('overlay').classList.remove('show');
    showHasil(teams);
  }, 2000);
}

function showHasil(teams) {
  // Build share text
  const txt = '⚽ HASIL UNDIAN FUNFORFEO ⚽\n\n' +
    teams.map(t =>
      `${t.badge} TEAM ${t.name}\n` +
      t.players.map((p,i) => `  ${i+1}. ${p.Nama} (${p.Posisi})${p.isCap?' 👑':''}`).join('\n')
    ).join('\n\n');

  document.getElementById('hasilArea').innerHTML = `
    <div class="box" style="margin-top:0;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;">🏆 HASIL UNDIAN</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-yellow" onclick="undi()" style="padding:10px 18px;font-size:13px;width:auto;">🔄 ULANG</button>
          <button class="btn btn-green" onclick="copyHasil()" style="padding:10px 18px;font-size:13px;width:auto;">📋 COPY</button>
        </div>
      </div>
      <div class="teams">
        ${teams.map(t => `
          <div class="team ${t.cls}">
            <div class="team-hd">
              <div class="team-hd-name">${t.name}</div>
              <div>${t.badge}</div>
            </div>
            <div class="team-body">
              ${t.players.map((p,i) => `
                <div class="trow ${p.isCap?'cap':''} ${p.isGK?'gk':''}">
                  <div class="tnum">${i+1}</div>
                  <div class="tname">${p.Nama} ${p.isCap?'👑':''}</div>
                  <div class="tpos b-${p.Posisi}">${p.Posisi}</div>
                </div>
              `).join('')}
              <div style="margin-top:6px;padding-top:6px;border-top:1px solid #1e1e1e;font-size:11px;color:#444;text-align:right;">${t.players.length} player</div>
            </div>
          </div>
        `).join('')}
      </div>
      <div style="font-size:12px;color:#444;margin-top:16px;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">Share ke grup:</div>
      <div class="share-txt" id="shareBox">${txt}</div>
    </div>
  `;

  // Scroll to result
  document.getElementById('hasilArea').scrollIntoView({ behavior:'smooth' });
}

function copyHasil() {
  const t = document.getElementById('shareBox')?.textContent;
  if (!t) return;
  navigator.clipboard.writeText(t).then(() => alert('✅ Hasil di-copy! Paste ke grup WhatsApp.'));
}
</script>
</body>
</html>
